name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-contracts:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.8.9"
      - run: ./scripts/validate-contracts.sh
      - run: ./scripts/validate-ci-artifacts.sh
      - run: ./scripts/test-ci-artifacts-policy.sh

  test-go-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache-dependency-path: implementations/go/go.sum
      - run: go test ./...
        working-directory: implementations/go
      - name: Build and verify Go artifact
        run: ./scripts/test-native-artifact-archive.sh go "${{ runner.arch }}"
      - name: Upload Go artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: polytui-go-macos-${{ runner.arch }}
          path: artifacts/go/polytui-go-macos-${{ runner.arch }}.tar.gz
          retention-days: 30
          if-no-files-found: error

  test-rust-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
          components: rustfmt
      - run: cargo fmt --check
        working-directory: implementations/rust
      - run: cargo test --locked
        working-directory: implementations/rust
      - name: Build and verify Rust artifact
        run: ./scripts/test-native-artifact-archive.sh rust "${{ runner.arch }}"
      - name: Upload Rust artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: polytui-rust-macos-${{ runner.arch }}
          path: artifacts/rust/polytui-rust-macos-${{ runner.arch }}.tar.gz
          retention-days: 30
          if-no-files-found: error

  test-typescript-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "10.33.2"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: pnpm
          cache-dependency-path: implementations/typescript/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: implementations/typescript
      - run: pnpm test
        working-directory: implementations/typescript
      - run: pnpm run typecheck
        working-directory: implementations/typescript
      - name: Build TypeScript artifact
        run: pnpm run build
        working-directory: implementations/typescript
      - name: Stage TypeScript artifact
        run: |
          mkdir -p ../../artifacts/typescript
          cp -R dist ../../artifacts/typescript/dist
          cp package.json ../../artifacts/typescript/package.json
        working-directory: implementations/typescript
      - name: Upload TypeScript artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: polytui-typescript
          path: artifacts/typescript
          retention-days: 30
          if-no-files-found: error

  test-python-macos-uv:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.8.9"
          python-version: "3.13.14"
          enable-cache: true
          cache-dependency-glob: implementations/python/uv.lock
      - run: uv sync --frozen
        working-directory: implementations/python
      - run: uv run pytest -q
        working-directory: implementations/python
      - name: Build Python artifact
        run: uv build --out-dir ../../artifacts/python
        working-directory: implementations/python
      - name: Upload Python artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: polytui-python
          path: artifacts/python
          retention-days: 30
          if-no-files-found: error

  blackbox-parity-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
          cache-dependency-path: implementations/go/go.sum
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
      - uses: pnpm/action-setup@v4
        with:
          version: "10.33.2"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: pnpm
          cache-dependency-path: implementations/typescript/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.8.9"
          python-version: "3.13.14"
          enable-cache: true
          cache-dependency-glob: implementations/python/uv.lock
      - run: pnpm install --frozen-lockfile
        working-directory: implementations/typescript
      - run: uv sync --frozen
        working-directory: implementations/python
      - run: ./scripts/check-versions.sh
      - run: ./scripts/test-run-targets.sh

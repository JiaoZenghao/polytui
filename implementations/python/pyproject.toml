[project]
name = "polytui"
version = "0.1.0.dev0"
description = "Python implementation of the PolyTUI learning project"
readme = "README.md"
authors = [
    { name = "JiaoZenghao", email = "jiaozenghao@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "textual==8.2.8",
    "typer==0.27.0",
]

[project.scripts]
polytui = "polytui.cli:app"

[build-system]
requires = ["uv_build>=0.8.9,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]
